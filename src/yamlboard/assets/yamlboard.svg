<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>yamlboard</title>
  <rect width="64" height="64" rx="14" fill="#174D98"/>
  <!-- the YAML: three indented lines -->
  <rect x="11" y="13" width="18" height="4" rx="2" fill="#EEF3F8"/>
  <rect x="17" y="21" width="14" height="4" rx="2" fill="#9EC5F4"/>
  <rect x="17" y="29" width="10" height="4" rx="2" fill="#9EC5F4"/>
  <!-- the board: three bars -->
  <rect x="34" y="34" width="6" height="18" rx="1.5" fill="#2A78D6"/>
  <rect x="42" y="24" width="6" height="28" rx="1.5" fill="#EB6834"/>
  <rect x="50" y="14" width="6" height="38" rx="1.5" fill="#1BAF7A"/>
  <rect x="11" y="52" width="45" height="2.5" rx="1.25" fill="#EEF3F8"/>
</svg>
