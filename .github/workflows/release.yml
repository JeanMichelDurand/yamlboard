name: release

# A pushed tag is not a GitHub release: this makes one, with the wheel and the sdist attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # for a tag pushed before this workflow existed (Actions → release → Run)
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the release and upload its files
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG, but pyproject.toml says $version"; exit 1; }
      - run: python -m pip install build && python -m build
      - run: gh release create "$TAG" dist/* --title "yamlboard ${TAG#v}" --generate-notes --verify-tag
