name: release

# A pushed tag is not a GitHub release: this makes one, with the wheel and the sdist attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # for a tag pushed before this workflow existed (Actions → release → Run)
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the release and upload its files
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "tag $TAG, but pyproject.toml says $version"; exit 1; }
      - run: python -m pip install build && python -m build
      - name: the GitHub release, kept if it exists (a run by hand to publish an older tag on PyPI)
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" dist/* --title "yamlboard ${TAG#v}" --generate-notes --verify-tag

  # Trusted publishing, no token: on pypi.org, a (pending) publisher for project yamlboard with this repository,
  # workflow release.yml (the file name, not the workflow's name) and environment pypi.
  pypi:
    needs: release                # the version check passed
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yamlboard
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
